<header class="navbar">

  <div class="navbar-content">

    <!-- Logo et identité -->
    <a
      class="brand"
      routerLink="/"
      (click)="onBrandClick($event)"
      aria-label="Retour à l'accueil Xibar24"
      title="Accueil Xibar24">
      <img src="assets/images/logot.png" alt="Xibar24 — Xamlé ak yégglé" />
    </a>

    <!-- Navigation -->
    <nav class="actions" aria-label="Navigation principale">

      <button type="button" class="categories-btn" (click)="openMenu()">
        <span>Rubriques</span>
        <img class="chevron" src="/assets/images/chevron.png" alt="" aria-hidden="true">
      </button>

      <a routerLink="/live" class="live-stream">
        <span class="live-dot"></span>
        Info en continu
      </a>

    </nav>

    <!-- Changement de thème -->
    <button
      type="button"
      class="theme-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="darkMode ? 'Activer le thème clair' : 'Activer le thème sombre'"
      [title]="darkMode ? 'Thème clair' : 'Thème sombre'">
      @if (darkMode) {
        ☀️
      } @else {
        🌙
      }
    </button>

  </div>

</header>
