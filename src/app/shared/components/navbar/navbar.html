<header class="navbar">

  <div class="navbar-content">

    <!-- Logo et identité -->
    <a class="brand" routerLink="/" aria-label="Accueil Xibar24">

      <img src="assets/images/logo.svg" alt="Xibar24" />

      <!-- <div class="brand-text">
        <span class="site-name">XIBAR24</span>
        <span class="slogan">xamlé ak yegglé</span>
      </div> -->

    </a>

    <!-- Navigation -->
    <nav class="actions" aria-label="Navigation principale">

      <button type="button" class="categories-btn" (click)="openMenu()">
        <span>Rubriques</span>
        <img class="chevron" src="/assets/images/chevron.png" alt="" aria-hidden="true">
      </button>
      <a routerLink="/live" class="live-stream">
        <span class="live-dot"></span>
        Info en continu
      </a>

    </nav>

    <!-- Changement de thème -->
    <button type="button" class="theme-btn" (click)="toggleTheme()"
      [attr.aria-label]="darkMode ? 'Activer le thème clair' : 'Activer le thème sombre'"
      [title]="darkMode ? 'Thème clair' : 'Thème sombre'">

      @if (darkMode) {
      ☀️
      } @else {
      🌙
      }

    </button>

  </div>

</header>
